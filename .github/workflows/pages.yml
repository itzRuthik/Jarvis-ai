name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'website.css'
      - 'website.js'
      - 'assets/**'
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site already lives at the repository root (index.html, website.css,
  # website.js, assets/) with the web app in app/, so publishing is a copy.
  # This job exists so deployment is deterministic and can run without
  # changing anything in the repository settings.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp index.html 404.html website.css website.js _site/
          cp -r assets _site/assets
          cp -r app _site/app
          # Drop anything that should never be published
          rm -f _site/app/robots.txt 2>/dev/null || true
          find _site -name '*.map' -delete 2>/dev/null || true
          node tools/verify-shell.mjs
          du -sh _site
          find _site -maxdepth 2 | sort | head -30

      # enablement: attempt to switch the repository's Pages source to
      # "GitHub Actions" automatically. If the token is not permitted to do that,
      # enable it once by hand: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
