name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'capacitor/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to (e.g. v1.1.0). Blank = build only.'
        required: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the web app before packaging it
        run: |
          node tools/verify-shell.mjs
          node tools/test.mjs

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into the Android project
        working-directory: capacitor
        run: |
          node scripts/prepare-www.mjs
          npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect artefacts
        id: collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp capacitor/android/app/build/outputs/apk/debug/app-debug.apk "dist/JARVIS-AI-${VERSION}-debug.apk"
          if [ -f capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/JARVIS-AI-${VERSION}-release-unsigned.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt) || true
          ls -lh dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-apk-${{ steps.collect.outputs.version }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to a release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.collect.outputs.version }}"
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "JARVIS AI ${TAG}" \
              --target "$GITHUB_SHA" \
              --notes "Automated Android build for JARVIS AI ${VERSION}.

          **Install:** download \`JARVIS-AI-${VERSION}-debug.apk\` and sideload it, or run \`adb install JARVIS-AI-${VERSION}-debug.apk\`.

          The APK is debug-signed, which is what makes it installable without a Play Store account. Verify the download with the attached \`SHA256SUMS.txt\`."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android build"
            echo ""
            echo "- version: \`${{ steps.collect.outputs.version }}\`"
            echo "- artifact: \`jarvis-ai-apk-${{ steps.collect.outputs.version }}\`"
            echo "- release: [latest](https://github.com/${{ github.repository }}/releases/latest)"
          } >> "$GITHUB_STEP_SUMMARY"
